name: publish packages

on:
  push:
    tags:
        - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: '10.0.x'
    - name: Build
      run: dotnet build -c Release Samhammer.Logging.sln
    - name: Pack
      run: dotnet pack -c Release --nologo
      # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push
      run: |
        dotnet nuget push "Samhammer.Logging/bin/Release/Samhammer.Logging.*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
        dotnet nuget push "Samhammer.Logging.Serilog/bin/Release/Samhammer.logging.Serilog.*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
